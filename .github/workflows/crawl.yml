name: RSS crawl

# 仅手动触发：生成结果不上传 Git，请本地 npm run crawl 后由维护者自行 commit。
on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: RSS → DeepSeek 写稿（中文）→ 审核
        run: npm run crawl
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Upload crawl output (artifact only, no git commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-output
          path: |
            src/content/blog/auto-*.md
            data/crawl-state.json
            data/crawl-rejected.json
          if-no-files-found: ignore
          retention-days: 14

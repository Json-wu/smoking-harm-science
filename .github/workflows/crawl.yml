name: RSS crawl

# 定时 + 手动：RSS → DeepSeek 中文写稿/审核 → 仅有新稿时 commit（触发 deploy）
on:
  schedule:
    # 每周二、四、六 01:30 UTC（北京时间 09:30）
    - cron: '30 1 * * 2,4,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-main
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: RSS → DeepSeek 写稿（中文）→ 审核
        id: crawl
        run: npm run crawl
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit crawl results
        if: steps.crawl.outputs.published == '1'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(crawl): publish reviewed auto article'
          file_pattern: |
            src/content/blog/auto-*.md
            data/crawl-state.json
            data/crawl-rejected.json

      - name: Commit crawl state (no new article)
        if: >-
          steps.crawl.outputs.processed != '0' &&
          steps.crawl.outputs.published != '1' &&
          steps.crawl.outputs.state_dirty == '1'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(crawl): update crawl state only'
          file_pattern: |
            data/crawl-state.json
            data/crawl-rejected.json

      - name: Upload crawl output (artifact backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-output-${{ github.run_id }}
          path: |
            src/content/blog/auto-*.md
            data/crawl-state.json
            data/crawl-rejected.json
          if-no-files-found: ignore
          retention-days: 14

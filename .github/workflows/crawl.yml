name: RSS crawl

# 定时 + 手动：RSS → DeepSeek 中文写稿/审核 → 有变更则 commit → 主动触发 deploy
on:
  schedule:
    # 每周二、四、六 01:30 UTC（北京时间 09:30）
    - cron: '30 1 * * 2,4,6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: crawl-main
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: RSS → DeepSeek 写稿（中文）→ 审核
        id: crawl
        run: npm run crawl
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Crawl run summary
        run: |
          if [ -f data/crawl-last-run.json ]; then
            echo "=== crawl-last-run.json ==="
            cat data/crawl-last-run.json
          else
            echo "未生成 crawl-last-run.json"
          fi
          echo "=== git status (auto 稿) ==="
          git status --short src/content/blog/auto-*.md data/crawl-state.json 2>/dev/null || true

      - name: Commit crawl results
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(crawl): publish reviewed auto article'
          file_pattern: |
            src/content/blog/auto-*.md
            data/crawl-state.json
            data/crawl-rejected.json

      - name: Trigger Build and deploy
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Upload crawl output (artifact backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-output-${{ github.run_id }}
          path: |
            src/content/blog/auto-*.md
            data/crawl-state.json
            data/crawl-rejected.json
            data/crawl-last-run.json
          if-no-files-found: ignore
          retention-days: 14

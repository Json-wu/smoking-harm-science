name: One-shot indexing backfill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          SITE_URL: https://yan.aivelo.net

      - name: Test IndexNow & GSC paths
        run: node scripts/test-indexing-paths.mjs
        env:
          SITE_URL: https://yan.aivelo.net
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Backfill all URLs (IndexNow + GSC)
        run: node scripts/one-shot-indexing-backfill.mjs
        env:
          SITE_URL: https://yan.aivelo.net
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}